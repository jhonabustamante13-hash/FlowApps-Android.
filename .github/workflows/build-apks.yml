
name: Crear los 6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Extraer proyectos
        run: unzip -o FlowApps-Android11-source.zip

      - name: Reparar código de Countdown
        run: |
          cat > FlowAppsAndroid/Countdown/app/src/main/java/com/flowapps/countdown/MainActivity.java <<'EOF'
          package com.flowapps.countdown;

          import android.app.*;
          import android.os.*;
          import android.widget.*;
          import java.util.*;

          public class MainActivity extends Activity {
              TextView output;
              CountDownTimer timer;

              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(1);
                  l.setPadding(28, 36, 28, 24);
                  l.setBackgroundColor(0xff101827);
                  setContentView(l);

                  TextView h = new TextView(this);
                  h.setText("Countdown");
                  h.setTextSize(30);
                  h.setTextColor(-1);
                  l.addView(h);

                  output = new TextView(this);
                  output.setText("Elige una fecha para iniciar la cuenta regresiva");
                  output.setTextColor(-1);
                  output.setTextSize(20);
                  l.addView(output);

                  Button choose = new Button(this);
                  choose.setText("Elegir fecha y hora");
                  l.addView(choose);

                  choose.setOnClickListener(v -> {
                      Calendar c = Calendar.getInstance();
                      new DatePickerDialog(this, (a, y, m, d) ->
                          new TimePickerDialog(this, (x, hh, mm) ->
                              start(y, m, d, hh, mm),
                              c.get(Calendar.HOUR_OF_DAY),
                              c.get(Calendar.MINUTE), true).show(),
                          c.get(Calendar.YEAR),
                          c.get(Calendar.MONTH),
                          c.get(Calendar.DAY_OF_MONTH)).show();
                  });
              }

              void start(int y, int m, int d, int h, int min) {
                  Calendar c = Calendar.getInstance();
                  c.set(y, m, d, h, min, 0);
                  long diff = c.getTimeInMillis() - System.currentTimeMillis();

                  if (diff <= 0) {
                      output.setText("La fecha ya pasó");
                      return;
                  }

                  if (timer != null) timer.cancel();

                  timer = new CountDownTimer(diff, 1000) {
                      public void onTick(long x) {
                          long s = x / 1000;
                          output.setText(
                              (s / 86400) + " días\n" +
                              ((s % 86400) / 3600) + " horas\n" +
                              ((s % 3600) / 60) + " minutos\n" +
                              (s % 60) + " segundos"
                          );
                      }

                      public void onFinish() {
                          output.setText("¡Llegó el momento!");
                      }
                  }.start();
              }
          }
          EOF

      - name: Aplicar los seis iconos
        run: |
          for app in EventFlow Countdown WordFlow GalleryX MusicFlow TaskFlow; do
            echo "Aplicando icono a $app..."
            mkdir -p "FlowAppsAndroid/$app/app/src/main/res/drawable"

            if [ ! -f "FlowAppsAndroid/icons/$app.png" ]; then
              echo "ERROR: No se encuentra FlowAppsAndroid/icons/$app.png"
              exit 1
            fi

            cp "FlowAppsAndroid/icons/$app.png" \
              "FlowAppsAndroid/$app/app/src/main/res/drawable/ic_launcher.png"

            sed -i 's/<application /<application android:icon="@drawable\/ic_launcher" /' \
              "FlowAppsAndroid/$app/app/src/main/AndroidManifest.xml"
          done

      - name: Crear APK de EventFlow
        run: gradle -p FlowAppsAndroid/EventFlow assembleDebug

      - name: Crear APK de Countdown
        run: gradle -p FlowAppsAndroid/Countdown assembleDebug

      - name: Crear APK de WordFlow
        run: gradle -p FlowAppsAndroid/WordFlow assembleDebug

      - name: Crear APK de GalleryX
        run: gradle -p FlowAppsAndroid/GalleryX assembleDebug

      - name: Crear APK de MusicFlow
        run: gradle -p FlowAppsAndroid/MusicFlow assembleDebug

      - name: Crear APK de TaskFlow
        run: gradle -p FlowAppsAndroid/TaskFlow assembleDebug

      - name: Reunir los APK
        run: |
          mkdir -p dist
          cp FlowAppsAndroid/EventFlow/app/build/outputs/apk/debug/app-debug.apk dist/EventFlow.apk
          cp FlowAppsAndroid/Countdown/app/build/outputs/apk/debug/app-debug.apk dist/Countdown.apk
          cp FlowAppsAndroid/WordFlow/app/build/outputs/apk/debug/app-debug.apk dist/WordFlow.apk
          cp FlowAppsAndroid/GalleryX/app/build/outputs/apk/debug/app-debug.apk dist/GalleryX.apk
          cp FlowAppsAndroid/MusicFlow/app/build/outputs/apk/debug/app-debug.apk dist/MusicFlow.apk
          cp FlowAppsAndroid/TaskFlow/app/build/outputs/apk/debug/app-debug.apk dist/TaskFlow.apk

      - name: Guardar los APK
        uses: actions/upload-artifact@v4
        with:
          name: Mis-seis-APK
          path: dist/*.apk
          
